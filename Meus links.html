<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leticia Fernandes | Meus links</title>
<meta name="description" content="WhatsApp, LinkedIn, portfólio em PDF e GitHub em um só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>

  :root {
  /* Fundo da página - Camada escura + Imagem na pasta correta */
  --bg: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), url('assents/imagens/amanhecer.png') center / cover fixed;
  --ink: #ffffff; /* Letras brancas */
  --muted: rgba(255, 255, 255, 0.85); /* Letras secundárias mais claras para melhorar a leitura */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
}

main {
  width: 100%;
  max-width: 460px;
  padding: 40px 20px 48px;
}

header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 14px;
}

/* Avatar com efeito de vidro */
.avatar {
  flex: none;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  /* Efeito Vidro no Avatar */
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  
  color: #ffffff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 24px;
  font-stretch: 125%;
}

h1 {
  margin: 0;
  font-size: 32px;
  line-height: 1.05;
  font-weight: 800;
  font-stretch: 125%;
  letter-spacing: -.01em;
}

.bio {
  margin: 0 0 30px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.5;
  max-width: 36ch;
}

.links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 18px; /* Espaço entre as barras */
}

/* === AQUI ESTÃO AS BARRAS TRANSPARENTES (EFEITO APPLE) === */
.btn {
  display: flex;
  align-items: stretch;
  min-height: 78px;
  text-decoration: none;
  color: #ffffff;
  overflow: hidden;
  
  /* 1. Formato arredondado de pílula */
  border-radius: 30px;
  
  /* 2. Fundo escuro transparente */
  background: rgba(0, 0, 0, 0.25);
  
  /* 3. O SEGREDO DO VIDRO: Desfoque do fundo */
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  
  /* 4. Borda fina clara (reflexo do vidro) */
  border: 1px solid rgba(255, 255, 255, 0.2);
  
  /* Sombra leve */
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  
  transition: transform 0.2s, background 0.2s, border 0.2s;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.4);
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(2px);
}

/* Área do Ícone na Barra */
.ico {
  flex: none;
  width: 72px;
  display: grid;
  place-items: center;
  /* Linha transparente separando o ícone do texto */
  border-right: 1px solid rgba(255, 255, 255, 0.15);
}

.ico svg {
  width: 30px;
  height: 30px;
  /* Aplica um leve brilho branco no ícone para combinar com o vidro */
  filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
}

.txt {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px 16px;
  min-width: 0;
}

.txt b {
  font-size: 20px;
  font-weight: 800;
  font-stretch: 125%;
  line-height: 1.1;
}

.txt span {
  font-size: 14px;
  margin-top: 4px;
  color: var(--muted);
}

@media(prefers-reduced-motion: reduce) {
  .btn {
    transition: none;
  }
}
</style>
</head>
