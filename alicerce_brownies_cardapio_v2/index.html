<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ec">
  <title>Alicerce Brownies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="round-btn close" aria-label="Fechar">×</button>
      <div class="browser-title">
        <strong>🔒 linktr.ee</strong>
        <span>Instagram</span>
      </div>
      <button class="round-btn more" aria-label="Mais opções">•••</button>
    </header>

    <div class="share-row">
      <div class="mini-brand">✱</div>
      <button class="share" aria-label="Compartilhar">⇧</button>
    </div>

    <section class="profile">
      <img src="logo.png" alt="Logo Alicerce Brownies" class="logo">
      <h1>Alicerce Brownies</h1>
      <p>Brownies artesanais</p>
      <p>Maceió, AL 📍</p>
    </section>

    <main class="links">
      <a class="link-card" href="#cardapio">
        <img src="brownie.png" alt="">
        <span>Cardápio Brownies</span>
        <b>⋮</b>
      </a>

      <a class="link-card" href="#monte">
        <img src="brownie2.png" alt="">
        <span>Monte o seu Brownie</span>
        <b>⋮</b>
      </a>

      <a class="link-card" href="#kits">
        <img src="gift.png" alt="">
        <span>Kits e Caixas Presente</span>
        <b>⋮</b>
      </a>

      <a class="link-card" href="#delivery">
        <img src="delivery.png" alt="">
        <span>Delivery | Delivery Próprio</span>
        <b>⋮</b>
      </a>

      <a class="link-card" id="whatsapp" href="#" target="_blank" rel="noopener">
        <img src="whatsapp.png" alt="">
        <span>Fale comigo no WhatsApp</span>
        <b>⋮</b>
      </a>

      <a class="link-card" href="https://instagram.com/alicerce.brownie" target="_blank" rel="noopener">
        <img src="instagram.png" alt="">
        <span>Acompanhe no Instagram</span>
        <b>⋮</b>
      </a>
    </main>

    <footer>Feito com amor 🤎</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
